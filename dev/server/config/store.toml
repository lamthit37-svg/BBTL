#==================================================
# CẤU HÌNH TIẾN TRÌNH LƯU TRỮ (STORE)
#==================================================
# Tệp: store.toml. Chỉ tiến trình store đọc tệp này.
# Store là người ghi duy nhất của database game: nhận thay đổi từ world và zone, ghi nhật ký, rồi
# gom lô xuống PostgreSQL.

#==================================================
# Chung
#==================================================
schema = 1   # Phiên bản bố cục của tệp; bộ đọc từ chối số nó không hiểu

#==================================================
# Database
#==================================================
# Địa chỉ cụm PostgreSQL nằm ở cluster.toml, mật khẩu ở secrets.local.toml.
[database]
name = "thienlong_game_1"   # Tên database: thienlong_game_<world.id của cluster.toml>
user = "thienlong_store"    # Role dùng để nối; chỉ store có mật khẩu của role này
pool = 4                    # Số kết nối giữ sẵn tới database (số tạm)

#==================================================
# Nhịp ghi
#==================================================
# Thay đổi nằm trong bộ nhớ tối đa bao lâu trước khi xuống đĩa. Đơn vị mili giây; hai số dưới chưa
# đo.
[flush]
character_ms = 30000   # Thay đổi thường của nhân vật: vị trí, kinh nghiệm
world_ms     = 60000   # Thay đổi của dữ liệu world: bang, thư, xếp hạng

#==================================================
# Nhật ký ghi
#==================================================
# Store ghi thay đổi vào nhật ký trước khi xuống database, để sập giữa chừng không mất.
[journal]
dir = "../data/store/journal"   # Thư mục chứa nhật ký

#==================================================
# Bảo mật
#==================================================
# Nhóm tuỳ chọn; thiếu nhóm hay thiếu khoá thì dùng đúng giá trị mặc định ghi dưới đây.
[security]
# Cửa sổ tối đa sau ban; 0 tới 10000, 0 là mỗi lệnh đều hỏi auth.
standing_cache_ms = 1000                             # Nhớ trạng thái ban của auth, mili giây
name_reserve_days = 30                               # Ngày giữ tên nhân vật xoá mềm cho chủ cũ (0 tới 3650)
# Id mặt/tóc tạo được, khớp creatable = 1 trong faces.tsv/hairs.tsv (race 0 nữ, 1 nam).
female_faces      = [1, 2, 3, 4, 5, 14]              # Id mặt nữ tạo được
male_faces        = [100, 101, 102, 103, 104, 113]   # Id mặt nam tạo được
female_hairs      = [1, 17, 19]                      # Id tóc nữ tạo được
male_hairs        = [5, 12, 14]                      # Id tóc nam tạo được
