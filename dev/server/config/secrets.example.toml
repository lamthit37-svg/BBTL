#==================================================
# MẪU TỆP BÍ MẬT
#==================================================
# Tệp: secrets.example.toml. Chỉ cho thấy hình dạng của secrets.local.toml; không tiến trình nào
# đọc.
# Tệp thật do lệnh "python TOOLS/server/setup_db.py init" sinh với mật khẩu ngẫu nhiên và bị git
# bỏ qua.

#==================================================
# Chung
#==================================================
schema = 1   # Phiên bản bố cục của tệp; bộ đọc từ chối số nó không hiểu

#==================================================
# Role quản trị postgres
#==================================================
# Role toàn quyền của cụm; chỉ dùng khi dựng và sao lưu.
[database.postgres]
password = ""   # Mật khẩu của role postgres

#==================================================
# Role của auth
#==================================================
# Role mà tiến trình auth dùng.
[database.thienlong_auth]
password = ""   # Mật khẩu của role thienlong_auth

#==================================================
# Role của billing
#==================================================
# Role mà tiến trình billing dùng.
[database.thienlong_billing]
password = ""   # Mật khẩu của role thienlong_billing

#==================================================
# Role của store
#==================================================
# Role mà tiến trình store dùng.
[database.thienlong_store]
password = ""   # Mật khẩu của role thienlong_store
