#==================================================
# LUẬT CHUNG
#==================================================
# Hệ số rơi đồ, hồi sinh quái, cấp hồi sinh tại chỗ, ngôn ngữ và trân thú lỗi.

#==================================================
# Chung
#==================================================
schema = 1   # Phiên bản bố cục của tệp; bộ đọc từ chối số nó không hiểu

#==================================================
# Rơi đồ
#==================================================
[drop]
drop_factor_permille = 1000   # Hệ số sửa tỉ lệ rơi đồ toàn cục.

#==================================================
# Độ bền
#==================================================
[durability]
equipment_damage_point = 500   # Điểm trừ độ bền trang bị.

#==================================================
# Hồi sinh quái
#==================================================
[respawn]
respawn_factor_permille = 1000   # Hệ số thời gian quái xuất hiện lại.

#==================================================
# Hồi sinh tại chỗ
#==================================================
[revive]
max_level = 20   # Cấp tối đa được hồi sinh tại chỗ.

#==================================================
# Trân thú lỗi
#==================================================
[pet_guard]
auto_remove_bad = true   # Bật thì tự gỡ trân thú lỗi.

#==================================================
# Ngôn ngữ
#==================================================
[language]
language = 1   # Mã ngôn ngữ: 0 Anh, 1 Trung giản thể, 2 Trung phồn thể, 3 Hàn, 4 Việt.

#==================================================
# Thông báo luân phiên
#==================================================
[rolling_notice]
declared_count = 0        # Số lượng thông báo.
interval       = 300000   # Khoảng cách giữa hai lần phát. Đơn vị chưa xác lập.

#==================================================
# Sự kiện theo giờ
#==================================================
[scheduled_event]
declared_count = 0   # Số lượng hoạt động.
