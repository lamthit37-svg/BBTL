#==================================================
# LUẬT CHỐNG NGHIỆN
#==================================================
# Ngưỡng giờ chơi mệt và câu hỏi chống treo máy.

#==================================================
# Chung
#==================================================
schema = 1   # Phiên bản bố cục của tệp; bộ đọc từ chối số nó không hiểu

#==================================================
# Mệt
#==================================================
[fatigue]
enabled        = true    # Bật trạng thái mệt.
mild_seconds   = 10800   # Số giây online thì vào mệt nhẹ.
severe_seconds = 18000   # Số giây online thì vào mệt nặng.

#==================================================
# Chống treo máy
#==================================================
[captcha]
enabled = false   # Bật câu hỏi chống treo máy.
